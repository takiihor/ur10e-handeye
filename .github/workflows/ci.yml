name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, linux, x64, ur10e-handeye]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up test environment
        shell: bash
        run: |
          set -euo pipefail
          python3.12 -m venv "$RUNNER_TEMP/ur10e-venv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          VENV="$RUNNER_TEMP/ur10e-venv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          DEPS="$RUNNER_TEMP/ur10e-deps-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$DEPS"
          git clone https://github.com/takiihor/charuco-generator.git "$DEPS/charuco-generator"
          git -C "$DEPS/charuco-generator" checkout 52093f99665e29d479b9a9e2c29b1aac05fee0d5
          git clone https://github.com/takiihor/charuco-realsense.git "$DEPS/charuco-realsense"
          git -C "$DEPS/charuco-realsense" checkout 69f83b58d615de54fa27194fcbb65a631bc706fb
          "$VENV/bin/python" -m pip install -r requirements.txt
          "$VENV/bin/python" -m pip install --no-deps -e "$DEPS/charuco-generator" -e "$DEPS/charuco-realsense" -e .
      - name: Run tests
        run: '"$RUNNER_TEMP/ur10e-venv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/bin/python" -m pytest -q'
      - name: Clean test environment
        if: always()
        run: rm -rf "$RUNNER_TEMP/ur10e-venv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$RUNNER_TEMP/ur10e-deps-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
